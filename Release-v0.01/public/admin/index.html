<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site admin — The Vulcan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#12100e;color:#f2e8d7;font:15px/1.55 Archivo,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#c9963f;text-decoration:none}
  a:hover{color:#e6b969}
  input,textarea,button,select{font:inherit}
  input,textarea{background:#1a1310;border:1px solid rgba(242,232,215,.16);color:#f2e8d7;padding:10px 11px;width:100%;min-width:0}
  input:focus,textarea:focus{outline:1px solid #c9963f;outline-offset:-1px}
  ::placeholder{color:#6d6353}
  .hd{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6d6353;font-weight:700}
  .btn{border:0;padding:12px 26px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer}
  .primary{background:#c9963f;color:#1a1310}
  .primary:hover{background:#e6b969}
  .ghost{background:transparent;border:1px solid rgba(242,232,215,.22);color:#cbbba0}
  .ghost:hover{border-color:#c9963f;color:#c9963f}
  .icon{background:transparent;border:1px solid rgba(242,232,215,.16);color:#8a7a63;width:36px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .icon:hover{border-color:#b9532f;color:#e0805f}
  .row{display:grid;gap:10px;align-items:center}
  .nav a{display:flex;justify-content:space-between;gap:10px;padding:10px 13px;font-size:14px;font-weight:600;color:#a08f78;border-left:2px solid transparent}
  .nav a:hover{background:rgba(201,150,63,.09)}
  .nav a.on{color:#f2e8d7;background:rgba(201,150,63,.12);border-left-color:#c9963f}
  .card{border:1px solid rgba(242,232,215,.16);background:#1a1310;padding:16px 18px}
  @media(max-width:820px){#app{grid-template-columns:1fr!important}#side{position:static!important;padding-right:0!important}#main{border-left:0!important;padding-left:0!important}}
</style>
</head>
<body>

<div id="login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <form id="loginForm" style="width:100%;max-width:380px">
    <div style="text-align:center;margin-bottom:34px">
      <div style="font-family:'Abril Fatface',Georgia,serif;font-size:30px;letter-spacing:.06em">THE VULCAN</div>
      <div class="hd" style="letter-spacing:.26em;color:#8a7a63;margin-top:10px">Site admin</div>
    </div>
    <div class="card" style="padding:30px 26px">
      <label class="hd" style="display:block;color:#c9963f;letter-spacing:.18em;margin-bottom:8px">Username</label>
      <input id="user" value="VulcanAdmin" autocomplete="username" style="margin-bottom:18px">
      <label class="hd" style="display:block;color:#c9963f;letter-spacing:.18em;margin-bottom:8px">Password</label>
      <input id="pass" type="password" autocomplete="current-password" style="margin-bottom:24px">
      <button class="btn primary" style="width:100%;padding:13px" type="submit">Sign in</button>
      <div id="loginErr" style="color:#e0805f;font-size:13px;margin-top:14px;display:none"></div>
    </div>
  </form>
</div>

<div id="shell" style="display:none;flex-direction:column;min-height:100vh">
  <div style="border-bottom:1px solid rgba(201,150,63,.28);background:#1a1310;position:sticky;top:0;z-index:20">
    <div style="max-width:1280px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div style="font-family:'Abril Fatface',Georgia,serif;font-size:21px;letter-spacing:.05em">THE VULCAN</div>
      <div class="hd" style="letter-spacing:.2em;color:#8a7a63;border-left:1px solid rgba(242,232,215,.2);padding-left:20px">Site admin</div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap">
        <a href="/" target="_blank" rel="noopener" class="hd" style="letter-spacing:.12em;color:#c9963f">View site &nearr;</a>
        <div style="display:flex;align-items:center;gap:9px">
          <div style="width:28px;height:28px;border-radius:50%;background:#c9963f;color:#1a1310;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">V</div>
          <span style="font-size:13px;color:#cbbba0">VulcanAdmin</span>
        </div>
        <button id="signout" class="btn ghost" style="padding:7px 13px;font-size:11px">Sign out</button>
      </div>
    </div>
  </div>

  <div id="app" style="flex:1;max-width:1280px;width:100%;margin:0 auto;padding:0 22px;display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start">
    <div id="side" style="padding:30px 24px 30px 0;position:sticky;top:70px">
      <div class="hd" style="letter-spacing:.2em;margin-bottom:12px">Content</div>
      <div class="nav" id="nav" style="display:flex;flex-direction:column;gap:2px"></div>
      <div style="margin-top:28px;border-top:1px solid rgba(242,232,215,.12);padding-top:18px">
        <div class="hd" style="letter-spacing:.2em;margin-bottom:10px">Status</div>
        <div style="font-size:12px;color:#8a7a63;line-height:1.6">Last published<br><span id="lastPub" style="color:#cbbba0">—</span></div>
      <button id="rollback" class="btn ghost" style="margin-top:14px;padding:8px 12px;font-size:11px;width:100%">Undo last publish</button>
      </div>
    </div>

    <div id="main" style="padding:30px 0 140px 28px;border-left:1px solid rgba(242,232,215,.12);min-width:0">
      <h1 id="title" style="font-family:'Abril Fatface',Georgia,serif;font-size:clamp(28px,4vw,40px);margin:0 0 8px;line-height:1.05"></h1>
      <p id="blurb" style="color:#8a7a63;margin:0 0 30px;max-width:620px"></p>
      <div id="body"></div>
      <button id="add" class="btn" style="margin-top:18px;background:transparent;border:1px dashed rgba(201,150,63,.5);color:#c9963f;padding:12px 20px;display:none">+ Add</button>
      <div id="note" style="font-size:13px;color:#6d6353;margin-top:14px"></div>
    </div>
  </div>

  <div style="position:sticky;bottom:0;z-index:30;border-top:1px solid rgba(201,150,63,.3);background:rgba(26,19,16,.97);backdrop-filter:blur(10px)">
    <div style="max-width:1280px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div id="dirty" style="display:flex;align-items:center;gap:10px;font-size:13px;color:#5fbf7a">
        <span id="dot" style="width:8px;height:8px;border-radius:50%;background:#5fbf7a"></span><span id="dirtyText">Everything published</span>
      </div>
      <div style="margin-left:auto;display:flex;gap:12px">
        <button id="discard" class="btn ghost">Discard</button>
        <button id="publish" class="btn primary">Publish to site</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" style="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;background:#1f3a34;border:1px solid #c9963f;padding:13px 22px;font-size:14px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const MAX_FEATURED = 6;
const SECTIONS = {
  homepage: { label:'Homepage', blurb:'The pub name, the headline over the photo, and the four figures in the band underneath.', add:null, kind:'homepage' },
  fixtures: { label:'Live sport', blurb:'Fixtures shown on the Live Sport page and the homepage.', add:'Add fixture',
    cols:[['day','Date','1.1fr','Sat 26 Sep'],['time','Time','.6fr','15:00'],['match','Match','2.4fr','Home v Away'],['comp','Competition','1.5fr','Premier League'],['sport','Sport','.9fr','Football']],
    blank:{day:'',time:'',match:'',comp:'',sport:''}, cap:12 },
  music: { label:'Live music', blurb:'Saturday night acts, shown on the What\u2019s On page.', add:'Add act',
    cols:[['date','Date','1fr','Sat 3 Oct'],['act','Act','2fr','Act name'],['kind','Description','2fr','Four-piece covers band'],['time','Time','.7fr','9pm']],
    blank:{date:'',act:'',kind:'',time:'9pm'}, cap:8 },
  week: { label:'Weekly nights', blurb:'The regular nights shown as cards on the What\u2019s On page \u2014 quiz, karaoke, live music.', add:'Add night',
    cols:[['day','Day','1fr','Tuesday'],['title','Night','1.6fr','Quiz Night'],['detail','Description','2.6fr','Teams of up to six.'],['time','Time','1fr','From 8pm']],
    blank:{day:'',title:'',detail:'',time:''}, cap:7 },
  announcements: { label:'Announcements', blurb:'Two fixed notices under the homepage hero. Clear the text to hide one — an empty announcement never appears on the site.', add:null, kind:'announcements', cap:2 },
  offers: { label:'Offers', blurb:'Star up to six offers to feature them in the box on the Drinks page.', add:'Add offer', kind:'offers', cap:40 },
  drinks: { label:'Drinks', blurb:'The three highlight cards, then what\u2019s behind the bar by category, each drink with its price.', add:null, kind:'drinks', cap:12 },
  hours: { label:'Opening hours', blurb:'Used for the Find Us page and the open/closed badge in the header.', add:null, kind:'hours', cap:7 },
  jugs: { label:'Vulcan jugs', blurb:'The jugs on the Drinks page, with what goes in them.', add:'Add jug',
    cols:[['name','Name','1.2fr','Vulcan Bomber'],['recipe','Recipe','3fr','6x Smirnoff vodka, Vimto, lemonade, ice']],
    blank:{name:'',recipe:''}, cap:12 },
  copy: { label:'Page text', blurb:'The line of text under each page heading, plus the address and footer.', add:null, kind:'copy' },
  photos: { label:'Photos', blurb:'Photos guests have uploaded by scanning the QR code. They go on the site straight away — bin anything that shouldn\u2019t be there.', add:null, kind:'photos', cap:300, instant:true },
  appearance: { label:'Appearance', blurb:'Five themes for the site. Pick one and it applies everywhere straight away.', add:null, kind:'appearance', instant:true }
};

let data = {}, section = 'fixtures', dirty = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2800); }

async function api(path, opts){
  const r = await fetch(path, Object.assign({ headers:{'content-type':'application/json'} }, opts));
  const body = await r.json().catch(()=>({}));
  if (r.ok) return body;
  // A 401 on any route other than login means the session has gone.
  if (r.status === 401 && path !== '/api/login') { show('login'); throw new Error('Session expired — sign in again'); }
  throw new Error(body.error || ('Request failed (' + r.status + ')'));
}

function show(which){
  $('login').style.display = which==='login' ? 'flex' : 'none';
  $('shell').style.display = which==='shell' ? 'flex' : 'none';
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').style.display='none';
  try {
    await api('/api/login', { method:'POST', body: JSON.stringify({ user:$('user').value, password:$('pass').value }) });
    $('pass').value = '';
    await load();
  } catch(err){ $('loginErr').textContent = err.message; $('loginErr').style.display='block'; }
});

$('signout').addEventListener('click', async () => {
  await fetch('/api/logout',{method:'POST'});
  show('login');
});

// Sections with no Add button need their fixed slots to exist before they can
// be edited — on a fresh KV namespace they come back empty.
const FIXED_DRINKS = ['Draught','Bottled beer & cider','Gin','Spirits','Cocktails','Wine','Shots','Mixers','Non-alcoholic'];
const DRINK_SEED = {
  'Draught': ['Fosters','Amstel','Cruzcampo','Birra Moretti','Strongbow','Strongbow Dark Fruit','Theakston'],
  'Bottled beer & cider': ['Budweiser','Sol','Peroni','Estrella','Desperados','Corona','Newcastle Brown','Old Mout','Blue WKD','Smirnoff Ice'],
  'Gin': ["Gordon's","Gordon's Pink",'Edinburgh Rhubarb & Ginger','Whitley Neill Parma Violet','Bombay Sapphire','Tanqueray'],
  'Spirits': ['Vodka','Bacardi','Southern Comfort','Malibu','Captain Morgans','Kraken',"Jack Daniel's",'Famous Grouse'],
  'Wine': ['Pinot Grigio','White Zinfandel','Merlot','Prosecco'],
  'Shots': ['Jagermeister / Jager Bomb','Skittle Bomb','Tequila Cream Bomb','Tequila','Wray & Nephew','Fireball','Silq Rose','Sourz','Sambucca','Baby Guinness','Mini Beer','After Eights','Kinder Bueno','Tequila Rose'],
  'Mixers': ['Indian tonic','Slimline tonic','Cranberry juice','Fresh orange','Ginger ale'],
  'Cocktails': ['Blue Lagoon','Sex on the Beach','Purple Rain','Woo Woo','Mojito','Pornstar Martini','Espresso Martini','Tequila Sunrise','Long Island Iced Tea','Strawberry Daiquiri','Black Russian'],
  'Non-alcoholic': ['Heineken Zero','Appletizer','Lemonade','Coke Zero','J20','Red Bull','Bottled water']
};

const splitDrink = s => { const b = String(s).split('|'); return { name: b[0].trim(), price: (b[1]||'').trim() || '£1.00' }; };
const joinDrink = d => d.name + ' | ' + (d.price || '£1.00');
function seedFixedSections(d){
  d.announcements = d.announcements || [];
  d.photos = d.photos || [];
  d.settings = d.settings || { uploadsOpen: true };
  d.theme = d.theme || { name:'mahogany' };
  d.appearance = [];
  d.homepage = [];
  if (!d.copy || !d.copy.length) d.copy = [{}];
  if (!d.brand || !d.brand.length) d.brand = [{ name: 'The Vulcan', messenger:'https://m.me/thevulcanpubwalkden', facebook:'https://www.facebook.com/thevulcanpubwalkden', instagram:'https://www.instagram.com/thevulcanpubwalkden/' }];
  if (!d.hero || !d.hero.length) d.hero = [{ kicker:'Walkden · Established 1833', title:'The best night\nin town.', subtitle:'A proper local. Every match on the big screens, live bands most weekends, and a warm welcome at the bar seven days a week.' }];
  if (!d.stats || !d.stats.length) d.stats = [
    { figure:'23', label:'TVs for sports and football' },
    { figure:'75"', label:'Big screen on the stage' },
    { figure:'2', label:'Outdoor screens out back' },
    { figure:'7', label:'Days a week, open late' }
  ];
  while (d.announcements.length < 2) d.announcements.push({ tag:'', text:'' });
  d.announcements = d.announcements.slice(0,2);
  if (!d.drinks || !d.drinks.length) d.drinks = FIXED_DRINKS.map(title => ({ title, items: (DRINK_SEED[title]||[]).map(n => n + ' | £1.00') }));
  d.highlights = d.highlights || [];
  while (d.highlights.length < 3) d.highlights.push({ kicker:'', title:'', text:'' });
  d.highlights = d.highlights.slice(0,3);
  return d;
}

async function load(){
  const res = await api('/api/admin/content');
  data = seedFixedSections(res); dirty.clear();
  $('lastPub').textContent = res.meta && res.meta.lastPublished
    ? new Date(res.meta.lastPublished).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}) : 'Never';
  show('shell'); render();
}

function markDirty(){ dirty.add(section); paintDirty(); }
function paintDirty(){
  const n = dirty.size;
  $('dirtyText').textContent = n ? n + ' section' + (n===1?'':'s') + ' with unsaved changes' : 'Everything published';
  const c = n ? '#e0a94a' : '#5fbf7a';
  $('dirty').style.color = c; $('dot').style.background = c;
}

function renderNav(){
  const seen = Number(localStorage.getItem('vulcan_lastSeenPhotos') || 0);
  $('nav').innerHTML = Object.keys(SECTIONS).map(k => {
    const n = (data[k]||[]).length;
    const fresh = k === 'photos' && n > seen && section !== 'photos';
    const badge = fresh
      ? `<span style="background:#c9963f;color:#1a1310;font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px">${n - seen} new</span>`
      : `<span style="font-size:11px;color:#6d6353">${n}</span>`;
    return `<a href="#${k}" class="${k===section?'on':''}"><span>${SECTIONS[k].label}</span>${badge}</a>`;
  }).join('');
  [...$('nav').children].forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); section = a.getAttribute('href').slice(1); render();
  }));
}

function bindInputs(){
  $('body').querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('input', () => {
      const key = el.dataset.k || section;
      const i = +el.dataset.i, f = el.dataset.f;
      if (f === 'items') data[key][i].items = el.value.split('\n').map(s=>s.trim()).filter(Boolean);
      else data[key][i][f] = el.value;
      dirty.add(key); paintDirty();
    });
  });
  $('body').querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => {
    data[section].splice(+el.dataset.del,1); markDirty(); render();
  }));
  $('body').querySelectorAll('[data-star]').forEach(el => el.addEventListener('click', () => {
    const i = +el.dataset.star, row = data[section][i];
    if (!row.featured && data[section].filter(o=>o.featured).length >= MAX_FEATURED) return toast('Six featured offers is the limit — unstar one first');
    row.featured = !row.featured; markDirty(); render();
  }));
}

function printQr(){
  const svg = $('qr').innerHTML;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>The Vulcan — photo QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Archivo:wght@600;700&display=swap" rel="stylesheet">
    <style>@page{size:A6;margin:0}body{margin:0;width:105mm;height:148mm;background:#1a1310;color:#f2e8d7;
      font-family:Archivo,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:12mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .k{font-size:7pt;letter-spacing:.3em;text-transform:uppercase;color:#c9963f;font-weight:700}
      h1{font-family:'Abril Fatface',Georgia,serif;font-size:26pt;line-height:1.05;margin:4mm 0 3mm;font-weight:400}
      p{font-size:10pt;color:#e0d2b8;margin:0 0 8mm;line-height:1.5}
      .qr{width:52mm;height:52mm;background:#f2e8d7;padding:4mm}
      .f{font-size:8pt;color:#a08f78;margin-top:8mm;letter-spacing:.06em}</style></head>
    <body><div class="k">The Vulcan, Walkden</div><h1>Had a good night?</h1>
    <p>Scan to add your photos<br>to our gallery</p><div class="qr">${svg}</div>
    <div class="f">thevulcan.info</div></body></html>`);
  w.document.close();
  setTimeout(()=>w.print(), 600);
}

function render(){
  const s = SECTIONS[section], list = data[section] || [];
  renderNav();
  $('title').textContent = s.label;
  $('blurb').textContent = s.blurb;
  $('note').textContent = '';
  const del = i => `<button class="icon" data-del="${i}" aria-label="Delete">&times;</button>`;

  if (s.cols){
    const grid = s.cols.map(c=>`minmax(0,${c[2]})`).join(' ') + ' 36px';
    $('body').innerHTML =
      `<div class="row hd" style="grid-template-columns:${grid};padding-bottom:8px">${s.cols.map(c=>`<div>${c[1]}</div>`).join('')}<div></div></div>` +
      `<div style="display:flex;flex-direction:column;gap:8px">` +
      list.map((r,i)=>`<div class="row" style="grid-template-columns:${grid}">` +
        s.cols.map(c=>`<input data-i="${i}" data-f="${c[0]}" value="${esc(r[c[0]])}" placeholder="${c[3]}">`).join('') +
        del(i) + `</div>`).join('') + `</div>`;
    $('note').textContent = list.length + ' of ' + s.cap + ' rows used.';
  }
  else if (s.kind === 'offers'){
    const featured = list.filter(o=>o.featured).length;
    $('body').innerHTML =
      `<div class="row hd" style="grid-template-columns:36px minmax(0,3fr) minmax(0,.8fr) 36px;padding-bottom:8px"><div></div><div>Offer</div><div>Price</div><div></div></div>` +
      `<div style="display:flex;flex-direction:column;gap:8px">` +
      list.map((r,i)=>`<div class="row" style="grid-template-columns:36px minmax(0,3fr) minmax(0,.8fr) 36px">
        <button class="icon" data-star="${i}" style="color:${r.featured?'#c9963f':'#5b5347'};border-color:rgba(242,232,215,.16)" aria-label="Feature">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="${r.featured?'#c9963f':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.2-5.4-2.9-5.4 2.9 1-6.2L3.2 9.5l6.1-.9z"/></svg>
        </button>
        <input data-i="${i}" data-f="name" value="${esc(r.name)}" placeholder="Offer name">
        <input data-i="${i}" data-f="price" value="${esc(r.price)}" placeholder="£0.00">${del(i)}</div>`).join('') + `</div>`;
    $('note').textContent = featured + ' of ' + MAX_FEATURED + ' featured slots used.';
  }
  else if (s.kind === 'announcements'){
    $('body').innerHTML = list.map((r,i)=>`<div class="card" style="margin-bottom:12px">
      <input data-i="${i}" data-f="tag" value="${esc(r.tag)}" placeholder="Label" style="background:#12100e;color:#c9963f;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:10px">
      <textarea data-i="${i}" data-f="text" rows="2" placeholder="What do you want people to know?" style="background:#12100e;resize:vertical">${esc(r.text)}</textarea></div>`).join('');
  }
  else if (s.kind === 'drinks'){
    const hl = data.highlights || [];
    $('body').innerHTML =
      `<div class="hd" style="letter-spacing:.18em;color:#c9963f;margin-bottom:10px">Three highlight cards</div>
       <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:30px">` +
      hl.map((h,i)=>`<div class="card">
         <input data-k="highlights" data-i="${i}" data-f="kicker" value="${esc(h.kicker)}" placeholder="Small label" style="background:#12100e;color:#c9963f;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:8px">
         <input data-k="highlights" data-i="${i}" data-f="title" value="${esc(h.title)}" placeholder="Headline" style="background:#12100e;margin-bottom:8px">
         <textarea data-k="highlights" data-i="${i}" data-f="text" rows="3" placeholder="One or two lines" style="background:#12100e;resize:vertical">${esc(h.text)}</textarea>
       </div>`).join('') +
      `</div>
       <div class="hd" style="letter-spacing:.18em;color:#c9963f;margin-bottom:10px">Categories</div>
       <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px">` +
      list.map((d,i)=>{
        const rows = (d.items||[]).map(splitDrink);
        return `<div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:12px">
          <div class="hd" style="letter-spacing:.14em;color:#c9963f;font-size:12px">${esc(d.title)}</div>
          <div style="font-size:11px;color:#6d6353">${rows.length} items</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">` +
        rows.map((r,j)=>`<div class="row" style="grid-template-columns:minmax(0,1fr) 92px 32px">
            <input data-cat="${i}" data-row="${j}" data-df="name" value="${esc(r.name)}" placeholder="Drink" style="background:#12100e;padding:8px 10px">
            <input data-cat="${i}" data-row="${j}" data-df="price" value="${esc(r.price)}" placeholder="£1.00" style="background:#12100e;padding:8px 10px;font-variant-numeric:tabular-nums">
            <button class="icon" data-delcat="${i}" data-delrow="${j}" style="width:32px;height:34px" aria-label="Remove">&times;</button>
          </div>`).join('') +
        `</div>
        <button data-addcat="${i}" class="btn" style="margin-top:10px;background:transparent;border:1px dashed rgba(201,150,63,.5);color:#c9963f;padding:8px 14px;font-size:11px;width:100%">+ Add drink</button>
      </div>`;}).join('') + `</div>`;

    const writeCat = (ci, rows) => { data.drinks[ci].items = rows.map(joinDrink); dirty.add('drinks'); paintDirty(); };
    const rowsOf = ci => (data.drinks[ci].items||[]).map(splitDrink);
    $('body').querySelectorAll('[data-cat]').forEach(el => el.addEventListener('input', () => {
      const ci = +el.dataset.cat, rows = rowsOf(ci);
      rows[+el.dataset.row][el.dataset.df] = el.value;
      writeCat(ci, rows);
    }));
    $('body').querySelectorAll('[data-delcat]').forEach(el => el.addEventListener('click', () => {
      const ci = +el.dataset.delcat, rows = rowsOf(ci);
      rows.splice(+el.dataset.delrow, 1); writeCat(ci, rows); render();
    }));
    $('body').querySelectorAll('[data-addcat]').forEach(el => el.addEventListener('click', () => {
      const ci = +el.dataset.addcat, rows = rowsOf(ci);
      rows.push({ name:'', price:'£1.00' }); writeCat(ci, rows); render();
    }));
    $('note').textContent = 'Clear a highlight\u2019s headline to hide that card. A category with no drinks disappears from the page.';
  }
  else if (s.kind === 'hours'){
    $('body').innerHTML =
      `<div class="row hd" style="grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:8px"><div>Day</div><div>Opens</div><div>Closes</div></div>` +
      list.map((r,i)=>`<div class="row" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:8px">
        <div style="font-weight:600">${esc(r.day)}</div>
        <input data-i="${i}" data-f="open" value="${esc(r.open)}">
        <input data-i="${i}" data-f="close" value="${esc(r.close)}"></div>`).join('');
    $('note').textContent = 'The site works out “Open now” from these automatically.';
  }

  else if (s.kind === 'photos'){
    const open = !data.settings || data.settings.uploadsOpen !== false;
    $('body').innerHTML =
      `<div class="card" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:20px">
         <div id="qr" style="width:104px;height:104px;background:#f2e8d7;padding:7px;flex:none"></div>
         <div style="flex:1 1 220px;min-width:0">
           <div class="hd" style="color:#c9963f;letter-spacing:.18em;margin-bottom:6px">Table QR code</div>
           <div style="font-size:13px;color:#a08f78;line-height:1.5">Guests scan this to upload. Print it for the tables.</div>
           <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
             <button id="printQr" class="btn ghost" style="padding:8px 14px;font-size:11px">Print QR</button>
             <button id="toggleUploads" class="btn ghost" style="padding:8px 14px;font-size:11px">${open?'Close uploads':'Reopen uploads'}</button>
           </div>
         </div>
         <div style="display:flex;align-items:center;gap:9px;font-size:13px;color:${open?'#5fbf7a':'#e0805f'}">
           <span style="width:8px;height:8px;border-radius:50%;background:${open?'#5fbf7a':'#e0805f'}"></span>
           ${open?'Uploads open':'Uploads closed'}
         </div>
       </div>` +
      (list.length
        ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">` +
          list.map(p=>`<div style="position:relative;aspect-ratio:1;border:1px solid rgba(242,232,215,.16);overflow:hidden">
            <img src="/photo/${encodeURIComponent(p.key)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
            <div style="position:absolute;left:0;right:0;bottom:0;padding:5px 7px;background:rgba(18,16,14,.78);font-size:10px;color:#a08f78">${new Date(p.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>
            <button class="icon" data-photo="${esc(p.key)}" title="Delete photo" style="position:absolute;top:6px;right:6px;width:28px;height:28px;background:rgba(18,16,14,.8)">&times;</button>
          </div>`).join('') + `</div>`
        : `<div class="card" style="text-align:center;padding:40px 20px;color:#6d6353">No photos uploaded yet.</div>`);

    if (window.qrcode){
      const q = qrcode(0,'M'); q.addData(location.origin + '/upload'); q.make();
      $('qr').innerHTML = q.createSvgTag({ cellSize:4, margin:0, scalable:true });
    }
    $('printQr').addEventListener('click', printQr);
    $('toggleUploads').addEventListener('click', async () => {
      try {
        const r = await api('/api/admin/uploads',{method:'PUT',body:JSON.stringify({open:!open})});
        data.settings = { uploadsOpen: r.uploadsOpen };
        toast(r.uploadsOpen ? 'Uploads reopened' : 'Uploads closed');
        render();
      } catch(err){ toast(err.message); }
    });
    $('body').querySelectorAll('[data-photo]').forEach(el => el.addEventListener('click', async () => {
      if (!confirm('Delete this photo? It comes off the site immediately.')) return;
      try {
        await api('/api/admin/photo',{method:'DELETE',body:JSON.stringify({key:el.dataset.photo})});
        data.photos = data.photos.filter(p=>p.key!==el.dataset.photo);
        toast('Photo deleted'); render();
      } catch(err){ toast(err.message); }
    }));
    $('note').textContent = list.length + ' photo' + (list.length===1?'':'s') + ' in the gallery.';
    localStorage.setItem('vulcan_lastSeenPhotos', String(list.length));
  }

  else if (s.kind === 'copy'){
    const c = (data.copy && data.copy[0]) || {};
    const b2 = (data.brand && data.brand[0]) || {};
    const field = (k,label,ph,rows) => `<div style="margin-bottom:16px">
      <div class="hd" style="letter-spacing:.16em;color:#c9963f;margin-bottom:7px">${label}</div>
      <textarea data-k="copy" data-i="0" data-f="${k}" rows="${rows||2}" placeholder="${ph}" style="background:#12100e;resize:vertical">${esc(c[k]||'')}</textarea>
    </div>`;
    $('body').innerHTML = `<div class="card">` +
      field('sport','Live sport page',"Most Manchester United games shown live…") +
      field('whatson',"What's on page",'Our regular nights, same every week…') +
      field('music','Live music section','Bands and singers on the stage most Saturday nights…') +
      field('drinks','Drinks page','Draught, bottles, a long gin list…') +
      field('jugs','Vulcan jugs section','Made to share. Eight of them…') +
      field('gallery','Gallery page','Karaoke, live bands, big matches…') +
      field('hours','Note under the opening hours','Weekend hours can change for football fixtures…') +
      `</div>
      <div class="card" style="margin-top:16px">
        <div class="hd" style="letter-spacing:.18em;color:#c9963f;margin-bottom:10px">Address</div>
        <textarea data-k="brand" data-i="0" data-f="address" rows="2" placeholder="94 Worsley Road North,&#10;Walkden, M28 3QW" style="background:#12100e;resize:vertical;margin-bottom:12px">${esc(b2.address||'')}</textarea>
        <div class="hd" style="letter-spacing:.18em;color:#c9963f;margin-bottom:10px">Footer line</div>
        <input data-k="brand" data-i="0" data-f="footerLine" value="${esc(b2.footerLine||'')}" placeholder="Established 1833 · 94 Worsley Road North…" style="background:#12100e">
      </div>`;
    $('note').textContent = 'Leave anything blank to fall back to the wording the site ships with.';
  }

  else if (s.kind === 'appearance'){
    const cur = (data.theme && data.theme.name) || 'mahogany';
    const THEMES = [
      { key:'mahogany',  label:'Mahogany',   note:'Dark wood and brass. The original.',      bg:'#1a1310', band:'#1f3a34', ink:'#f2e8d7', accent:'#c9963f' },
      { key:'snug',      label:'Snug',       note:'Deep green, warmer gold.',                bg:'#16241f', band:'#1d2f28', ink:'#f0ece0', accent:'#d6a15a' },
      { key:'publicbar', label:'Public Bar', note:'Near-black with a copper accent.',        bg:'#17161a', band:'#231f21', ink:'#f1eeea', accent:'#e08a63' },
      { key:'parlour',   label:'Parlour',    note:'Off-white paper, bottle green.',          bg:'#f4efe4', band:'#e3dac7', ink:'#1f1712', accent:'#3f5c33' },
      { key:'taproom',   label:'Tap Room',   note:'Warm stone with a deep red.',             bg:'#f1eeea', band:'#ded7cd', ink:'#211c19', accent:'#8d2f24' }
    ];
    $('body').innerHTML =
      `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px">` +
      THEMES.map(t=>`<button data-theme="${t.key}" style="border:2px solid ${cur===t.key?'#c9963f':'rgba(242,232,215,.16)'};background:#1a1310;padding:0;cursor:pointer;text-align:left;display:block;width:100%">
        <div style="background:${t.bg};padding:18px 16px 14px">
          <div style="font-family:Georgia,serif;font-size:19px;color:${t.ink};line-height:1.1">The Vulcan</div>
          <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:${t.accent};margin-top:7px">Live sport tonight</div>
          <div style="display:flex;gap:6px;margin-top:12px">
            <span style="flex:1;height:8px;background:${t.accent}"></span>
            <span style="flex:1;height:8px;background:${t.band}"></span>
            <span style="flex:1;height:8px;background:${t.ink};opacity:.35"></span>
          </div>
        </div>
        <div style="padding:12px 16px 14px;background:#1a1310">
          <div style="font-size:14px;font-weight:700;color:#f2e8d7;display:flex;justify-content:space-between;align-items:center">
            ${t.label}${cur===t.key?'<span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c9963f">In use</span>':''}
          </div>
          <div style="font-size:12px;color:#a08f78;margin-top:4px">${t.note}</div>
        </div>
      </button>`).join('') + `</div>`;

    $('body').querySelectorAll('[data-theme]').forEach(el => el.addEventListener('click', async () => {
      try {
        const r = await api('/api/admin/theme',{method:'PUT',body:JSON.stringify({ name: el.dataset.theme })});
        data.theme = r.theme; toast(r.theme.label + ' applied'); render();
      } catch(err){ toast(err.message); }
    }));
    $('note').textContent = 'Each theme is a full palette, picked so the text stays readable. The hero photo keeps its dark overlay in all of them.';
  }

  $('add').style.display = s.add ? 'inline-block' : 'none';
  $('add').textContent = s.add || '';
  bindInputs(); paintDirty();
}

$('add').addEventListener('click', () => {
  const s = SECTIONS[section];
  if (!s.add) return;
  if (data[section].length >= s.cap) return toast(s.cap + ' is the limit for this section');
  data[section].push(s.kind === 'offers' ? {name:'',price:'',featured:false} : Object.assign({}, s.blank));
  markDirty(); render();
});

$('discard').addEventListener('click', async () => { await load(); toast('Changes discarded'); });

$('publish').addEventListener('click', async () => {
  if (!dirty.size) return toast('Nothing to publish');
  try {
    for (const key of [...dirty]) {
      if (SECTIONS[key] && SECTIONS[key].instant) continue; // photos save as you go
      await api('/api/admin/content', { method:'PUT', body: JSON.stringify({ key, value: data[key] }) });
    }
    dirty.clear(); paintDirty();
    $('lastPub').textContent = new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
    toast('Published — live in a few seconds');
  } catch(err){ toast(err.message); }
});

$('rollback').addEventListener('click', async () => {
  if (SECTIONS[section].instant) return toast('Photos are deleted individually, not rolled back');
  if (!confirm('Undo the last publish for ' + SECTIONS[section].label + '?')) return;
  try { await api('/api/admin/rollback',{method:'POST',body:JSON.stringify({key:section})}); await load(); toast('Rolled back'); }
  catch(err){ toast(err.message); }
});

api('/api/admin/content').then(load).catch(()=>show('login'));
</script>
</body>
</html>
