document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er\" style=\"display:inline-block;margin-top:30px;background:var(--accent);color:var(--on-accent);padding:15px 30px;font-weight:700;font-size:14px;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;border-radius:2px\" style-hover=\"background:var(--accent-hi);text-decoration:none\">Message us on Facebook<\u002Fa>\n          <div style=\"display:flex;gap:22px;margin-top:26px;flex-wrap:wrap\">\n            <a href=\"{{ facebookUrl }}\" style=\"font-size:13px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700\">Facebook<\u002Fa>\n            <a href=\"{{ instagramUrl }}\" style=\"font-size:13px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700\">Instagram<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-height:420px;border:1px solid color-mix(in srgb, var(--ink) 16%, transparent)\">\n          <iframe title=\"Map to The Vulcan, Walkden\" src=\"https://maps.google.com/maps?q=94%20Worsley%20Road%20North%2C%20Walkden%2C%20Worsley%20M28%203QW&amp;z=15&amp;output=embed\" style=\"width:100%;height:100%;min-height:420px;border:0;filter:grayscale(0.4) invert(0.92) hue-rotate(180deg) contrast(0.9)\" loading=\"lazy\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  \n\n  <sc-if value=\"{{ lightbox }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeLightbox }}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(13,10,8,0.94);display:flex;align-items:center;justify-content:center;padding:32px;cursor:zoom-out\">\n      <div role=\"img\" aria-label=\"Photo from The Vulcan\" style=\"width:100%;height:100%;border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);background-size:contain;background-repeat:no-repeat;background-position:center;background-image:{{ lightboxBg }}\"><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeLightbox }}\" aria-label=\"Close\" style=\"position:absolute;top:22px;right:26px;backgroun e';\n  }\n  state = { now: new Date(), lightbox: null, galleryOpen: false, page: Component.pageFromUrl() };\n  componentDidMount() {\n    this.t = setInterval(() => this.setState({ now: new Date() }), 60000);\n    this.onPop = () => this.setState({ page: Component.pageFromUrl() });\n    window.addEventListener('popstate', this.onPop);\n    // Live content from the Worker (/api/content). If it fails, the baked-in\n    // defaults below stay on screen — the site never shows an error.\n    fetch('/api/content', { headers: { accept: 'application/json' } })\n      .then(r => (r.ok ? r.json() : null))\n      .then(live => { if (live) { this.setState({ live }); this.applyTheme(live.theme); } })\n      .catch(() => {});\n  }\n  // Every drink carries a price; anything missing one falls back to £1.00.\n  priced(lists) {\n    return lists.map(l => ({\n      title: l.title,\n      items: (l.items || []).map(it => ({ name: it.name, price: it.price || '£1.00' }))\n    }));\n  }\n  applyTheme(theme) {\n    if (!theme || !theme.vars) return;\n    const root = document.documentElement;\n    Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));\n  }\n  componentWillUnmount() { clearInterval(this.t); window.removeEventListener('popstate', this.onPop); }\n\n  renderVals() {\n    const accent = this.props.accent ?? 'var(--accent)';\n    const page = this.state.page;\n    const nav = p => (page === p ? accent : 'var(--muted)');\n    const schedule = [\n      ['Monday', 16, 24], ['Tuesday', 16, 24], ['Wednesday', 16, 24],\n      ['Thursday', 16, 24], ['Friday', 14, 25], ['Saturday', 14, 25], ['Sunday', 14, 24]\n    ];\n    const fmt = h => { const hh = h % 24; return (hh === 0 ? '12' : hh > 12 ? hh - 12 : hh) + (hh < 12 ? 'am' : 'pm'); };\n    const now = this.state.now;\n    const idx = (now.getDay() + 6) % 7;\n    const mins = now.getHours() * 60 + now.getMinutes();\n    const cur = schedule[idx];\n    const prev = schedule[(idx + 6) % 7];\n    const house = Array.from({ length: 17 }, (_, i) => ({\n      src: 'assets/gallery/g' + String(i + 1).padStart(2, '0') + '.avif',\n      alt: 'A night at The Vulcan, Walkden'\n    }));\n    const guest = ((this.state.live || {}).photos || []).map(p => ({\n      src: '/photo/' + encodeURIComponent(p.key),\n      alt: 'A night at The Vulcan, Walkden'\n    }));\n    const gallery = guest.concat(house);\n    const openNow = (mins >= cur[1] * 60 && mins < cur[2] * 60) || (prev[2] > 24 && mins < (prev[2] - 24) * 60);\n    const live = this.state.live || {};\n    const brand = (live.brand && live.brand[0]) || {};\n    const pubName = brand.name || 'The Vulcan';\n    const copy = (live.copy && live.copy[0]) || {};\n    const has = k => Array.isArray(live[k]) && live[k].length > 0;\n\n    return {\n      isHome: page === 'home', isSport: page === 'sport', isWhatson: page === 'whatson',\n      isDrinks: page === 'drinks', navDrinks: nav('drinks'),\n      pubName: pubName,\n      address: brand.address || '94 Worsley Road North,\\nWalkden, M28 3QW',\n      footerLine: brand.footerLine || 'Established 1833 · 94 Worsley Road North, Walkden, M28 3QW',\n      copySport: copy.sport || \"Most Manchester United games shown live, plus golf, F1, snooker and darts. Ask behind the bar and we'll put whatever we can on for you.\",\n      copyWhatson: copy.whatson || 'Our regular nights, same every week. Live sport is on throughout — see the fixtures page.',\n      copyMusic: copy.music || 'Bands and singers on the stage most Saturday nights. Free entry, always.',\n      copyDrinks: copy.drinks || \"Draught, bottles, a long gin list and Jo's whiskey bar. Cocktails and jugs made fresh at the bar.\",\n      copyJugs: copy.jugs || 'Made to share. Eight of them, all built behind the bar.',\n      copyGallery: copy.gallery || 'Karaoke, live bands, big matches and the beer garden in summer. Tap any photo to see it full size.',\n      copyHours: copy.hours || 'Saturday and Sunday hours can change for football fixtures. Follow us on Facebook for updates.',\n      messengerUrl: brand.messenger || 'https://m.me/thevulcanpubwalkden',\n      facebookUrl: brand.facebook || 'https://www.facebook.com/thevulcanpubwalkden',\n      instagramUrl: brand.instagram || 'https://www.instagram.com/thevulcanpubwalkden/',\n      copyright: '© 2026 ' + pubName + ', Walkden',\n      galleryLead: 'Nights at ' + pubName,\n      heroKicker: (has('hero') ? live.hero[0].kicker : null) || 'Walkden · Established 1833',\n      heroTitle: (has('hero') ? live.hero[0].title : null) || 'The best night\\nin town.',\n      heroSubtitle: (has('hero') ? live.hero[0].subtitle : null) || 'A proper local. Every match on the big screens, live bands most weekends, and a warm welcome at the bar seven days a week.',\n      stats: has('stats') ? live.stats : [\n        { figure: '23', label: 'TVs for sports and football' },\n        { figure: '75\"', label: 'Big screen on the stage' },\n        { figure: '2', label: 'Outdoor screens out back' },\n        { figure: '7', label: 'Days a week, open late' }\n      ],\n      highlights: (has('highlights') ? live.highlights : [\n        { kicker: 'House shot', title: 'The Vulcan Juice', text: 'Our own recipe, made in house. On its own, as a Vulcan Bomb, or with lemonade.' },\n        { kicker: 'Over 22 to go at', title: \"Jo's Whiskey & Bourbon Bar\", text: 'From classic Jim Beam bourbon to Sheep Dog peanut butter whiskey.' },\n        { kicker: \"Gin o'clock\", title: 'Double up for £2.20', text: 'Across the full gin range, all day, every day.' }\n      ]).filter(h => h && (h.title || '').trim()),\n      drinkLists: this.priced(has('drinks')\n        ? live.drinks\n            .filter(d => d && Array.isArray(d.items) && d.items.length)\n            .map(d => ({ title: d.title, items: d.items.map(n => {\n              const bar = String(n).split('|');\n              return { name: bar[0].trim(), price: (bar[1] || '').trim() || '£1.00' };\n            }) }))\n        : [\n        { title: 'Draught', items: [\n          { name: 'Fosters', note: 'lager' }, { name: 'Amstel', note: 'lager' },\n          { name: 'Cruzcampo', note: 'lager' }, { name: 'Birra Moretti', note: 'lager' },\n          { name: 'Strongbow', note: 'cider' }, { name: 'Strongbow Dark Fruit', note: 'cider' },\n          { name: 'Theakston', note: 'ale' }\n        ] },\n        { title: 'Bottled beer & cider', items: [\n          { name: 'Budweiser' }, { name: 'Sol' }, { name: 'Peroni' }, { name: 'Estrella' },\n          { name: 'Desperados' }, { name: 'Corona' }, { name: 'Newcastle Brown' },\n          { name: 'Wainwrights' }, { name: 'Hobgoblin Red' }, { name: 'Old Mout', note: 'four flavours' },\n          { name: 'Blue WKD' }, { name: 'Orange WKD' }, { name: 'Smirnoff Ice' }\n        ] },\n        { title: 'Gin', items: [\n          { name: \"Gordon's\" }, { name: \"Gordon's Pink\" }, { name: \"Gordon's Peach\" },\n          { name: \"Gordon's Sicilian Lemon\" }, { name: \"Gordon's Mediterranean Orange\" },\n          { name: \"Gordon's Passionfruit\" }, { name: 'Edinburgh Rhubarb & Ginger' },\n          { name: 'Edinburgh Raspberry' }, { name: 'Whitley Neill Parma Violet' },\n          { name: 'Whitley Neill Pineapple' }, { name: 'Bombay Sapphire' }, { name: 'Tanqueray' }\n        ] },\n        { title: 'Spirits', items: [\n          { name: 'Vodka' }, { name: 'Bacardi' }, { name: 'Southern Comfort' }, { name: 'Malibu' },\n          { name: 'Captain Morgans', note: 'spiced, apple, pineapple' }, { name: 'Lambs Rum' },\n          { name: 'Kraken' }, { name: 'Powers' }, { name: 'Fireball' }, { name: 'Amaretto' },\n          { name: \"Jack Daniel's\" }, { name: 'Courvoisier' }, { name: 'Wray & Nephew' },\n          { name: 'Archers' }, { name: 'Famous Grouse' }, { name: 'Cheeky Vimto', note: 'port & Blue WKD' }\n        ] },\n        { title: 'Cocktails', items: [\n          { name: 'Blue Lagoon' }, { name: 'Sex on the Beach' }, { name: 'Purple Rain' },\n          { name: 'Boozy Woozy' }, { name: 'Godfather No. 7' }, { name: 'Rainbow Paradise' },\n          { name: 'Woo Woo' }, { name: 'Mojito' }, { name: 'Pornstar Martini' },\n          { name: 'Passion Hawaii' }, { name: 'Passion Paradise' }, { name: 'Espresso Martini' },\n          { name: 'Tequila Sunrise' }, { name: 'Long Island Iced Tea' }, { name: 'Strawberry Daiquiri' },\n          { name: 'Black Russian' }\n        ] },\n        { title: 'Wine', items: [\n          { name: 'Pinot Grigio' }, { name: 'White Zinfandel' }, { name: 'Merlot' },\n          { name: 'Prosecco' }, { name: 'Small and large bottles', note: '' }\n        ] },\n        { title: 'Shots', items: [\n          { name: 'Jagermeister / Jager Bomb' }, { name: 'Skittle Bomb' }, { name: 'Tequila Cream Bomb' },\n          { name: 'Tequila' }, { name: 'Wray & Nephew' }, { name: 'Fireball' }, { name: 'Silq Rose' },\n          { name: 'Sourz', note: 'five flavours' }, { name: 'Sambucca', note: 'six flavours' },\n          { name: 'Baby Guinness' }, { name: 'Mini Beer' }, { name: 'After Eights' },\n          { name: 'Kinder Bueno' }, { name: 'Tequila Rose' }\n        ] },\n        { title: 'Mixers', items: [\n          { name: 'Indian tonic' }, { name: 'Slimline tonic' }, { name: 'Cranberry juice' },\n          { name: 'Fresh orange' }, { name: 'Ginger ale' }\n        ] },\n        { title: 'Non-alcoholic', items: [\n          { name: 'Heineken Zero' }, { name: 'Appletizer' }, { name: 'Lemonade' }, { name: 'Coke Zero' },\n          { name: 'Cordials', note: 'vimto, lime, blackcurrant, orange' }, { name: 'Orange juice' },\n          { name: 'Ginger beer' }, { name: 'Fanta' }, { name: '7up Sugar Free' },\n          { name: 'J20', note: 'three flavours' }, { name: 'Red Bull' }, { name: 'Bottled water' },\n          { name: 'Flavoured water' }, { name: 'Kids pop' }, { name: 'Simply Fruit' }\n        ] }\n      ]),\n      cocktails: ['Blue Lagoon', 'Sex on the Beach', 'Purple Rain', 'Boozy Woozy', 'Godfather No. 7',\n        'Rainbow Paradise', 'Woo Woo', 'Mojito', 'Pornstar Martini', 'Passion Hawaii', 'Passion Paradise',\n        'Espresso Martini', 'Tequila Sunrise', 'Long Island Iced Tea', 'Strawberry Daiquiri', 'Black Russian'],\n      jugs: has('jugs') ? live.jugs : [\n        { name: 'Vulcan Bomber', recipe: '6x Smirnoff vodka, Vimto, lemonade, ice' },\n        { name: 'Vulcan Fun', recipe: '3x Smirnoff vodka, 2x Archers, Malibu, J20, lemonade & ice' },\n        { name: 'Vulcan Jack', recipe: \"5x Jack Daniel's, 2x ginger ale, lime juice, Coca Cola, ice\" },\n        { name: 'Vulcan Beast', recipe: '2x Blue WKD, 2x Orange WKD, 2x Smirnoff Ice, ice' },\n        { name: 'Vulcan Chill', recipe: '5x Southern Comfort, lime juice, lemonade, ice' },\n        { name: 'Vulcan Sourz', recipe: '2x Vulcan Juice, one of each Sourz, lemonade, ice' },\n        { name: 'Cheeky Vimto', recipe: '4x 50ml port, 3x Blue WKD, ice' },\n        { name: 'Vulcan Fire', recipe: '5x Fireball, 4x cranberry or apple, half pint lemonade or pint and a half of coke' }\n      ],\n      offers: has('offers') ? live.offers : [\n        { name: 'Sourz 4x', price: '£6.30' },\n        { name: 'Sambucca 4x', price: '£10.00' },\n        { name: 'Jagerbomb / Skittlebomb 2x', price: '£6.50' },\n        { name: 'Baby Guinness / After Eights / Mini Beer / Kinder Bueno 2x', price: '£7.00' },\n        { name: 'Tequila Rose 3x', price: '£5.00' },\n        { name: 'Vulcan Juice shot 4x', price: '£9.50' },\n        { name: 'Vulcan Bomb 2x', price: '£4.90' }\n      ],\n      isGallery: page === 'gallery', isFind: page === 'find',\n      navSport: nav('sport'), navWhatson: nav('whatson'),       navGallery: nav('gallery'), navFind: nav('find'),\n      go: e => {\n        e.preventDefault();\n        const p = e.currentTarget.getAttribute('data-page');\n        if (!p) return;\n        const slug = { home: '/', sport: '/sport', whatson: '/whats-on', drinks: '/drinks', gallery: '/gallery', find: '/find' }[p] || '/';\n        if (location.pathname !== slug) history.pushState({ page: p }, '', slug);\n        this.setState({ page: p });\n        window.scrollTo(0, 0);\n      },\n      showRefurbNote: this.props.showRefurbNote ?? true,\n      announcements: has('announcements')\n        ? live.announcements.filter(a => a && (a.text || '').trim()).map(a => ({ tag: a.tag, date: '', text: a.text }))\n        : [\n        { tag: 'Newly refurbished', date: '', text: 'The Vulcan has reopened after a full refit of the bar, lounge and beer garden.' },\n        { tag: 'Function room', date: '', text: 'Birthdays, christenings and wakes — message us on Facebook to check dates.' }\n      ],\n      statusText: openNow ? 'Open now' : 'Closed — opens ' + fmt(cur[1]),\n      statusDot: openNow ? '#5fbf7a' : '#9a5b4a',\n      hours: has('hours')\n        ? live.hours.map((h, i) => ({ day: h.day, time: h.open + ' – ' + h.close, tint: i === idx ? accent : 'var(--muted)' }))\n        : schedule.map((s, i) => ({\n        day: s[0],\n        time: fmt(s[1]) + ' – ' + fmt(s[2]),\n        tint: i === idx ? accent : 'var(--muted)'\n      })),\n      fixtures: has('fixtures') ? live.fixtures : [\n        { day: 'Sat 26 Sep', time: '12:30', match: 'Manchester United v Newcastle', comp: 'Premier League', sport: 'Football' },\n        { day: 'Sat 26 Sep', time: '17:30', match: 'Arsenal v Liverpool', comp: 'Premier League', sport: 'Football' },\n        { day: 'Sat 26 Sep', time: '20:00', match: 'Catterall v Taylor', comp: 'Super-lightweight title', sport: 'Boxing' },\n        { day: 'Sun 27 Sep', time: '13:00', match: 'Singapore Grand Prix', comp: 'Formula 1', sport: 'F1' },\n        { day: 'Mon 28 Sep', time: '20:00', match: 'Aston Villa v Brighton', comp: 'Premier League', sport: 'Football' },\n        { day: 'Tue 29 Sep', time: '19:00', match: 'World Grand Prix, semi-finals', comp: 'PDC', sport: 'Darts' }\n      ],\n      week: has('week')\n        ? live.week.map(w => ({ day: w.day, title: w.title, detail: w.detail, time: w.time, tint: accent }))\n        : [\n        { day: 'Tuesday', title: 'Quiz Night', detail: 'Teams of up to six. Cash prize and a bar tab.', time: 'From 8pm', tint: accent },\n        { day: 'Friday', title: 'Karaoke', detail: 'Grab the mic. Free entry, everyone welcome.', time: 'From 9pm', tint: accent },\n        { day: 'Saturday', title: 'Live Music', detail: 'Bands and singers on the stage after the football.', time: 'From 9pm', tint: accent }\n      ],\n      gigs: has('music')\n        ? live.music.map(m => ({ slot: 'act photo — landscape', date: m.date, act: m.act, kind: m.kind }))\n        : [\n        { slot: 'act photo — landscape', date: 'Sat 3 Oct', act: 'The Salford Keys', kind: 'Four-piece covers band' },\n        { slot: 'act photo — landscape', date: 'Sat 10 Oct', act: 'Danny Hart', kind: 'Solo acoustic' },\n        { slot: 'act photo — landscape', date: 'Sat 17 Oct', act: 'Northern Soul Night', kind: 'DJ set' }\n      ],\n      gallery,\n      shownGallery: this.state.galleryOpen ? gallery : gallery.slice(0, 8),\n      galleryToggleLabel: this.state.galleryOpen ? 'Show fewer photos' : 'Show all ' + gallery.length + ' photos',\n      toggleGallery: () => this.setState(s => ({ galleryOpen: !s.galleryOpen })),\n      lightbox: this.state.lightbox,\n      lightboxBg: this.state.lightbox ? 'url(\"' + this.state.lightbox + '\")' : 'none',\n      openLightbox: e => {\n        const el = e.currentTarget.querySelector('img');\n        if (el) this.setState({ lightbox: el.getAttribute('src') });\n      },\n      closeLightbox: () => this.setState({ lightbox: null })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
